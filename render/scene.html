<!doctype html>
<html><head><meta charset="utf-8"><title>vial render</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1600, H = +q.get('h') || 1600;
const VIAL_ML = +q.get('vial') || 3;
const U_CENTER = +q.get('u') || 0.36;           // label u that faces the camera (same for every product)
const THEME = q.get('bg') || 'offwhite';
const BG = THEME === 'navy'
  ? { top: '#13224A', bottom: '#060C1F', floor: '#0A1530', shadow: 0.55 }
  : { top: '#F7F7F5', bottom: '#ECEBE7', floor: '#ECEBE7', shadow: 0.16 };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
function studioEnv() {
  const env = new THREE.Scene();
  const wall = new THREE.Mesh(new THREE.BoxGeometry(200, 120, 200), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.55, 0.55, 0.55), side: THREE.BackSide }));
  wall.position.y = 40; env.add(wall);
  const soft = (w, h, x, y, z, ry, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.rotation.y = ry; env.add(m); };
  const flag = (w, h, x, y, z, ry) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.rotation.y = ry; env.add(m); };
  soft(18, 90, -55, 40, 30, Math.PI / 2.6, 9);      // tall key strip, front-left
  soft(10, 90, 60, 40, -10, -Math.PI / 2.2, 5);     // rim strip, back-right
  const top = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 3, 3), side: THREE.DoubleSide }));
  top.rotation.x = Math.PI / 2; top.position.y = 95; env.add(top);
  flag(30, 90, -40, 40, -50, Math.PI / 4);           // black cards: give the glass its dark edges
  flag(30, 90, 45, 40, 45, -Math.PI / 4);
  flag(40, 90, 0, 40, 95, Math.PI);                  // behind the camera, darkens the centre reflection
  return env;
}
scene.environment = pmrem.fromScene(studioEnv(), 0.015).texture;
scene.environmentIntensity = 1.0;

// ---- seamless studio sweep: unlit backdrop + floor in exact brand colours (not tone mapped) ----
function gradientTex(top, bottom) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const back = new THREE.Mesh(new THREE.PlaneGeometry(400, 160), new THREE.MeshBasicMaterial({ map: gradientTex(BG.top, BG.bottom), toneMapped: false }));
back.position.set(0, 80, -60); scene.add(back);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 200), new THREE.MeshBasicMaterial({ color: BG.floor, toneMapped: false }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 40); scene.add(floor);
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: BG.shadow }));
shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.position.y = 0.01; shadowCatcher.receiveShadow = true; scene.add(shadowCatcher);

// soft contact shadow directly under the vial
function contactTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(0.45, 'rgba(0,0,0,0.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c);
}

// ---- vial: matched to FSD's actual vials (photos on the Freedom certificates) within ISO 8362-1 2R / 6R dimensions ----
// Straight body, tight rounded shoulder, short neck showing the dark freeze-drying stopper, short silver seal, thin flip-off.
const SEAL = q.get('seal') === 'gold' ? { color: '#CDA85A', rough: 0.36 } : { color: '#C9CDD2', rough: 0.4 };   // satin aluminium, as on FSD's vials
const ISO = VIAL_ML >= 5
  ? { d1: 22, d2: 20, d3: 16.5, d4: 12.6, h1: 40, yShoulder: 29.2, shR: 2.4, yNeck: 32.4, flangeH: 3.4, r1: 3.5, stopperH: 1.8, btnH: 3.2, cakeH: 12, labelH: 19 }
  : { d1: 16, d2: 13, d3: 10.5, d4: 7.0, h1: 35, yShoulder: 25.0, shR: 1.8, yNeck: 27.6, flangeH: 3.0, r1: 2.5, stopperH: 1.4, btnH: 2.8, cakeH: 10, labelH: 17 };
const Rb = ISO.d1 / 2, Rf = ISO.d2 / 2, Rn = ISO.d3 / 2, Rbore = ISO.d4 / 2, Ri = Rb - 1.0;
const yFlange = ISO.h1 - ISO.flangeH;

const g = [];
g.push(new THREE.Vector2(0.001, 0.45), new THREE.Vector2(Rb - ISO.r1 - 0.8, 0.05), new THREE.Vector2(Rb - ISO.r1, 0));
for (let i = 1; i <= 10; i++) { const a = (i / 10) * Math.PI / 2;           // heel
  g.push(new THREE.Vector2(Rb - ISO.r1 + ISO.r1 * Math.sin(a), ISO.r1 - ISO.r1 * Math.cos(a))); }
g.push(new THREE.Vector2(Rb, ISO.yShoulder));                               // straight body
const cx = Rb - ISO.shR;                                                     // tight shoulder arc
for (let i = 1; i <= 10; i++) { const a = (i / 10) * THREE.MathUtils.degToRad(58);
  g.push(new THREE.Vector2(cx + ISO.shR * Math.cos(a), ISO.yShoulder + ISO.shR * Math.sin(a))); }
const last = g[g.length - 1];
g.push(new THREE.Vector2(Rn + 0.45, ISO.yNeck - 0.35));                     // short slope
for (let i = 1; i <= 5; i++) { const t = i / 5;                            // concave fillet into the neck
  g.push(new THREE.Vector2(Rn + 0.45 * (1 - Math.sin(t * Math.PI / 2)), ISO.yNeck - 0.35 + 0.35 * t)); }
g.push(new THREE.Vector2(Rn, yFlange - 0.1));                               // neck
g.push(new THREE.Vector2(Rn + 0.3, yFlange + 0.12), new THREE.Vector2(Rf - 0.3, yFlange + 0.45), new THREE.Vector2(Rf, yFlange + 0.85));
g.push(new THREE.Vector2(Rf, ISO.h1 - 0.4), new THREE.Vector2(Rf - 0.4, ISO.h1), new THREE.Vector2(Rbore, ISO.h1), new THREE.Vector2(0.001, ISO.h1));
const glass = new THREE.Mesh(new THREE.LatheGeometry(g, 192), new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.0, transmission: 1, thickness: 1.2, ior: 1.52, dispersion: 0.15,
  specularIntensity: 1, envMapIntensity: 1.3, attenuationColor: new THREE.Color('#E2F0EC'), attenuationDistance: 45 }));
glass.castShadow = true; scene.add(glass);

const contact = new THREE.Mesh(new THREE.PlaneGeometry(Rb * 4.4, Rb * 4.4), new THREE.MeshBasicMaterial({ map: contactTex(), transparent: true, depthWrite: false, opacity: THEME === 'navy' ? 0.9 : 0.6 }));
contact.rotation.x = -Math.PI / 2; contact.position.y = 0.02; scene.add(contact);

// lyophilized cake: bright white, matte, tall, slightly shrunk from the wall, uneven top
const cakeH = ISO.cakeH, cakeR = Ri - 0.2, cakeY0 = 0.75;
const cakeGeo = new THREE.CylinderGeometry(cakeR, cakeR, cakeH, 96, 10, false);
const cpos = cakeGeo.attributes.position;
for (let i = 0; i < cpos.count; i++) {
  const x = cpos.getX(i), y = cpos.getY(i), z = cpos.getZ(i), ang = Math.atan2(z, x), rr = Math.hypot(x, z);
  if (y > cakeH / 2 - 0.01) cpos.setY(i, y + 0.4 * Math.sin(ang * 3 + rr) * (rr / cakeR) - 0.3 * (rr / cakeR) ** 2);
  else if (rr > cakeR - 0.01) { const k = 1 + 0.015 * Math.sin(ang * 13 + y * 2.3) * Math.sin(y * 1.7); cpos.setX(i, x * k); cpos.setZ(i, z * k); }
}
cakeGeo.computeVertexNormals();
const cake = new THREE.Mesh(cakeGeo, new THREE.MeshStandardMaterial({ color: '#FBFBF9', roughness: 1 }));
cake.position.y = cakeY0 + cakeH / 2; scene.add(cake);

// freeze-drying stopper: dark grey rubber plug in the neck bore with two vent slots, flange on the glass top
const rubber = new THREE.MeshStandardMaterial({ color: '#3E4147', roughness: 0.7 });
const plugTop = ISO.h1, plugSolid = VIAL_ML >= 5 ? 6.2 : 5.0, legLen = VIAL_ML >= 5 ? 3.4 : 2.6;   // solid plug shows below the seal, then short legs
const solid = new THREE.Mesh(new THREE.CylinderGeometry(Rbore - 0.03, Rbore - 0.03, plugSolid, 64), rubber);
solid.position.y = plugTop - plugSolid / 2; scene.add(solid);
for (const t0 of [THREE.MathUtils.degToRad(10), THREE.MathUtils.degToRad(190)]) {   // two legs, 160° each: narrow vent slots front and back
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(Rbore - 0.05, Rbore - 0.25, legLen, 48, 1, false, t0, THREE.MathUtils.degToRad(160)), rubber);
  leg.position.y = plugTop - plugSolid - legLen / 2; scene.add(leg);
}
const flangeRub = new THREE.Mesh(new THREE.CylinderGeometry(Rf - 0.2, Rf - 0.2, ISO.stopperH, 96), rubber);
flangeRub.position.y = ISO.h1 + ISO.stopperH / 2; scene.add(flangeRub);

// aluminium seal: short band, rolled under the flange
const sealTop = ISO.h1 + ISO.stopperH + 0.2;
const sp = [new THREE.Vector2(Rn + 0.15, yFlange - 0.15), new THREE.Vector2(Rn + 0.55, yFlange - 0.02), new THREE.Vector2(Rf - 0.05, yFlange + 0.32),
  new THREE.Vector2(Rf + 0.26, yFlange + 0.85), new THREE.Vector2(Rf + 0.28, sealTop - 0.28), new THREE.Vector2(Rf + 0.05, sealTop),
  new THREE.Vector2(Rf - 1.4, sealTop), new THREE.Vector2(Rf - 1.4, sealTop - 0.2)];
const sealGeo = new THREE.LatheGeometry(sp, 180);
const spos = sealGeo.attributes.position;                                    // crimp pleats where the skirt is rolled under
for (let i = 0; i < spos.count; i++) { const y = spos.getY(i); if (y < yFlange + 0.9) {
  const x = spos.getX(i), z = spos.getZ(i), ang = Math.atan2(z, x), k = 1 + 0.018 * Math.max(0, Math.cos(ang * 22));
  spos.setX(i, x * k); spos.setZ(i, z * k); } }
sealGeo.computeVertexNormals();
const seal = new THREE.Mesh(sealGeo, new THREE.MeshPhysicalMaterial({ color: SEAL.color, metalness: 1, roughness: SEAL.rough, anisotropy: 0.6, envMapIntensity: 0.8, side: THREE.DoubleSide }));
seal.castShadow = true; scene.add(seal);

// flip-off button: thin, matte, slightly wider than the seal, rounded edge, shallow recess
const Rbtn = Rf + 0.45, bt = sealTop + ISO.btnH;
const bp = [new THREE.Vector2(0.001, sealTop + 0.04), new THREE.Vector2(Rbtn - 0.35, sealTop + 0.04)];
for (let i = 0; i <= 6; i++) { const a = -Math.PI / 2 + (i / 6) * Math.PI / 2;    // rounded lower edge
  bp.push(new THREE.Vector2(Rbtn - 0.35 + 0.35 * Math.cos(a), sealTop + 0.39 + 0.35 * Math.sin(a))); }
for (let i = 0; i <= 8; i++) { const a = (i / 8) * Math.PI / 2;                    // rounded upper edge
  bp.push(new THREE.Vector2(Rbtn - 0.55 + 0.55 * Math.cos(a), bt - 0.55 + 0.55 * Math.sin(a))); }
bp.push(new THREE.Vector2(Rbtn - 1.2, bt), new THREE.Vector2(Rbtn - 1.4, bt - 0.15), new THREE.Vector2(0.001, bt - 0.15));
const button = new THREE.Mesh(new THREE.LatheGeometry(bp, 160), new THREE.MeshPhysicalMaterial({ color: '#12214A', roughness: 0.55, clearcoat: 0.12, clearcoatRoughness: 0.5, envMapIntensity: 0.7 }));
button.castShadow = true; scene.add(button);
const V = { h: bt, r: Rb };

// label: real print file on the straight body, same rotation for every product
const LABEL_H = ISO.labelH, LABEL_W = LABEL_H * (1400 / 780), rL = Rb + 0.05;
const thetaLength = LABEL_W / rL;
const labelTex = await new THREE.TextureLoader().loadAsync(q.get('label'));
labelTex.colorSpace = THREE.SRGBColorSpace; labelTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const label = new THREE.Mesh(new THREE.CylinderGeometry(rL, rL, LABEL_H, 256, 1, true, -U_CENTER * thetaLength, thetaLength),
  new THREE.MeshPhysicalMaterial({ map: labelTex, roughness: 0.5, clearcoat: 0.3, clearcoatRoughness: 0.18, envMapIntensity: 0.45, side: THREE.FrontSide,
    transparent: true, opacity: 1, depthWrite: true }));   // transparent = excluded from the glass's refraction texture
label.position.y = ISO.r1 + 1.6 + LABEL_H / 2; label.castShadow = true; scene.add(label);
const backing = new THREE.Mesh(new THREE.CylinderGeometry(rL - 0.02, rL - 0.02, LABEL_H, 256, 1, true, -U_CENTER * thetaLength, thetaLength),
  new THREE.MeshStandardMaterial({ color: '#F4F2EC', roughness: 0.9, side: THREE.BackSide }));
backing.position.y = label.position.y; scene.add(backing);

// ---- lights: soft key from the left, fill, warm rim on the glass edge ----
scene.add(new THREE.HemisphereLight(0xffffff, THEME === 'navy' ? 0x0a1530 : 0xe6e4df, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(-35, 140, 55); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 22; key.shadow.blurSamples = 32; key.shadow.bias = -0.0006;
Object.assign(key.shadow.camera, { left: -40, right: 40, top: 60, bottom: -20, near: 1, far: 300 }); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe7b8, 1.6); rim.position.set(70, 40, -60); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(60, 20, 80); scene.add(fill);

// ---- camera: long lens, slight elevation, vial fills ~64% of frame height ----
const aspect = W / H;
const camera = new THREE.PerspectiveCamera(14, aspect, 1, 2000);
const target = new THREE.Vector3(0, V.h * 0.5, 0);   // V.h = top of the flip-off button
const frameH = (V.h + 4) / (aspect < 1 ? 0.60 : 0.68);          // world height the frame should cover at the vial
const dist = (frameH / 2) / Math.tan(THREE.MathUtils.degToRad(14 / 2));
camera.position.set(0, target.y + dist * Math.sin(THREE.MathUtils.degToRad(4)), dist * Math.cos(THREE.MathUtils.degToRad(4)));
camera.lookAt(target.x, target.y - (aspect < 1 ? V.h * 0.08 : 0), target.z);

renderer.render(scene, camera); renderer.render(scene, camera);   // second pass settles transmission
window.__png = renderer.domElement.toDataURL('image/png');
window.__done = true;
</script></body></html>
