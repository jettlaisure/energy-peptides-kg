<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Peptides Graph Map</title>
<style>
  @font-face { font-family: "Satoshi"; font-weight: 400; src: url(../web/public/fonts/satoshi-400.woff2) format("woff2"); }
  @font-face { font-family: "Satoshi"; font-weight: 500; src: url(../web/public/fonts/satoshi-500.woff2) format("woff2"); }
  @font-face { font-family: "Satoshi"; font-weight: 700; src: url(../web/public/fonts/satoshi-700.woff2) format("woff2"); }
  @font-face { font-family: "Satoshi"; font-weight: 900; src: url(../web/public/fonts/satoshi-900.woff2) format("woff2"); }
  :root {
    color-scheme: dark;
    --void: #060C1F; --navy: #0D1B3E; --lift: #13224A; --rule: #21386E; --rule-soft: #182B58;
    --gold: #D4AF5F; --gold-hi: #F0D48A; --steel: #6E8CB8; --powder: #A8B4DC;
    --text: #EEF2F9; --dim: #9FB2CE; --faint: #6C82A6; --danger: #E08A8A;
    --sans: "Satoshi", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--navy); color: var(--text); font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 20px; padding: 14px 20px; background: var(--void); border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .title { display: grid; gap: 2px; }
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--steel); }
  h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -0.02em; }
  .counts { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .search { margin-left: auto; position: relative; }
  .search input { width: 260px; font: inherit; color: var(--text); background: var(--navy); border: 1px solid var(--rule); border-radius: 2px; padding: 8px 10px; }
  .search input:focus { outline: 2px solid var(--gold-hi); outline-offset: 1px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
  #stage { position: relative; min-height: 0; border-right: 1px solid var(--rule); }
  #cy { position: absolute; inset: 0; }
  .types { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; pointer-events: none; }
  .chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--sans); letter-spacing: .06em; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--rule); background: rgba(6,12,31,.85); color: var(--faint); cursor: pointer; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); opacity: .35; }
  .chip.on { color: var(--text); border-color: var(--steel); }
  .chip.on .dot { opacity: 1; }
  .chip .n { color: var(--faint); font-variant-numeric: tabular-nums; }
  .chip:focus-visible, button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
  .toolbar { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; z-index: 2; }
  button { font: 500 12px/1 var(--sans); color: var(--text); background: rgba(6,12,31,.9); border: 1px solid var(--rule); border-radius: 2px; padding: 8px 11px; cursor: pointer; }
  button:hover { border-color: var(--steel); }
  button[disabled] { opacity: .4; cursor: default; }
  button.primary { border-color: var(--gold); color: var(--gold-hi); }
  aside { overflow-y: auto; padding: 20px; display: grid; align-content: start; gap: 16px; background: var(--navy); }
  .empty p { color: var(--dim); margin: 6px 0 0; }
  .kbd { color: var(--faint); font-size: 12px; }
  .d-type { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--steel); }
  .d-type .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  h2 { margin: 4px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.2; overflow-wrap: anywhere; }
  .aliases { color: var(--faint); font-size: 12px; margin-top: 4px; }
  .prov { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--faint); }
  .pill { font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--dim); }
  .pill.high { color: var(--powder); border-color: var(--steel); }
  .pill.warn { color: var(--gold-hi); border-color: var(--gold); }
  .pill.bad { color: var(--danger); border-color: var(--danger); }
  .section-label { font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--steel); margin: 0 0 6px; }
  dl { margin: 0; display: grid; grid-template-columns: minmax(96px, 38%) 1fr; border-top: 1px solid var(--rule-soft); }
  dt, dd { margin: 0; padding: 7px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13px; }
  dt { color: var(--faint); padding-right: 10px; }
  dd { color: var(--powder); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  ul.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  ul.links li { display: grid; grid-template-columns: 124px 1fr; gap: 8px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--rule-soft); }
  .rel { color: var(--faint); font-size: 11px; letter-spacing: .06em; padding-top: 2px; overflow-wrap: anywhere; }
  a.node-link { color: var(--text); text-decoration: none; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; overflow-wrap: anywhere; }
  a.node-link:hover { color: var(--gold-hi); }
  a.node-link .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); transform: translateY(-1px); }
  .note { color: var(--faint); font-size: 12px; border-top: 1px solid var(--rule); padding-top: 12px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } #stage { border-right: 0; border-bottom: 1px solid var(--rule); } .search input { width: 180px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="title"><span class="eyebrow">Knowledge graph</span><h1>Energy Peptides graph map</h1></div>
  <span class="counts" id="counts"></span>
  <div class="search">
    <label class="kbd" for="q" style="position:absolute;left:-9999px">Find</label>
    <input id="q" list="names" placeholder="Find a product, peptide, lot, study…" autocomplete="off">
    <datalist id="names"></datalist>
  </div>
</header>
<main>
  <section id="stage" aria-label="Graph">
    <div class="types" id="types"></div>
    <div id="cy"></div>
    <div class="toolbar">
      <button id="focus" disabled>Show only its neighbourhood</button>
      <button id="depth" disabled>Depth 1</button>
      <button id="all">Full view</button>
      <button id="fit">Fit</button>
    </div>
  </section>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>/*__CYTOSCAPE__*/</script>
<script>
const DATA = /*__DATA__*/null;
const COLORS = {
  Product: "#F0D48A", Supplier: "#D4AF5F", BrandRule: "#B8860B",
  Peptide: "#A8B4DC", Compound: "#8FA3E0", ResearchArea: "#7FB0D6",
  Batch: "#6E8CB8", InventoryEvent: "#45618F", Asset: "#3E5A86",
  Study: "#9FD1C4", Claim: "#C9A6E3", FAQItem: "#CBD5E1", Keyword: "#6C82A6",
  Page: "#EEF2F9", ComplianceRule: "#E08A8A"
};
const ORDER = ["Product","Peptide","Compound","Batch","Supplier","Study","Claim","ResearchArea","FAQItem","Page","Keyword","Asset","InventoryEvent","ComplianceRule","BrandRule"];
const DEFAULT_ON = new Set(["Product","Peptide","Compound","Batch","Supplier","Study","Claim"]);
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const deg = new Map(); DATA.edges.forEach(e => { deg.set(e.s, (deg.get(e.s)||0)+1); deg.set(e.t, (deg.get(e.t)||0)+1); });
const label = n => n.type === "Asset" ? n.name.split("/").pop() : n.type === "FAQItem" ? (n.attrs.question || n.name) : n.name;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => Array.isArray(v) ? v.join(", ") : (v === true ? "yes" : v === false ? "no" : typeof v === "object" && v ? JSON.stringify(v) : String(v));

const on = new Set(DEFAULT_ON);
let focusRoot = null, depth = 1, selected = null;

const cy = cytoscape({
  container: document.getElementById("cy"),
  elements: [
    ...DATA.nodes.map(n => ({ data: { id: n.id, label: label(n), type: n.type, color: COLORS[n.type] || "#9FB2CE", deg: deg.get(n.id) || 0 },
      classes: [(n.type === "Claim" && n.attrs.status === "prohibited") ? "prohibited" : "", n.conf !== "high" ? "unsure" : "", n.valid_to ? "stale" : ""].join(" ") })),
    ...DATA.edges.filter(e => byId.has(e.s) && byId.has(e.t)).map((e, i) => ({ data: { id: "e" + i, source: e.s, target: e.t, rel: e.rel } }))
  ],
  minZoom: 0.15, maxZoom: 3, wheelSensitivity: 0.25,
  style: [
    { selector: "node", style: { "background-color": "data(color)", "label": "data(label)", "color": "#9FB2CE", "font-family": "Satoshi, Helvetica Neue, Arial, sans-serif",
      "font-size": 9, "text-valign": "bottom", "text-margin-y": 4, "text-max-width": 110, "text-wrap": "ellipsis",
      "width": "mapData(deg, 0, 24, 10, 34)", "height": "mapData(deg, 0, 24, 10, 34)", "border-width": 0,
      "text-outline-color": "#0D1B3E", "text-outline-width": 2 } },
    { selector: "node.unsure", style: { "border-width": 1.5, "border-style": "dashed", "border-color": "#6C82A6" } },
    { selector: "node.prohibited", style: { "border-width": 2, "border-style": "dashed", "border-color": "#E08A8A" } },
    { selector: "node.stale", style: { "opacity": 0.5 } },
    { selector: "edge", style: { "width": 1, "line-color": "#21386E", "curve-style": "bezier", "target-arrow-shape": "triangle", "arrow-scale": 0.55, "target-arrow-color": "#21386E" } },
    { selector: ".hidden", style: { "display": "none" } },
    { selector: ".faded", style: { "opacity": 0.12 } },
    { selector: "edge.hl", style: { "line-color": "#6E8CB8", "target-arrow-color": "#6E8CB8", "width": 1.6, "label": "data(rel)", "font-size": 7, "color": "#6C82A6",
      "text-rotation": "autorotate", "text-background-color": "#0D1B3E", "text-background-opacity": 1, "text-background-padding": 1 } },
    { selector: "node.hl", style: { "color": "#EEF2F9", "font-size": 10 } },
    { selector: "node:selected", style: { "border-width": 3, "border-style": "solid", "border-color": "#F0D48A", "color": "#F0D48A", "font-weight": 700 } }
  ]
});

function counts() {
  const t = {}; DATA.nodes.forEach(n => t[n.type] = (t[n.type] || 0) + 1);
  return t;
}
const TC = counts();
document.getElementById("counts").textContent = `${DATA.nodes.length} nodes · ${DATA.edges.length} relationships · generated ${DATA.generated_at.replace("T", " ").slice(0, 16)} UTC`;

function renderChips() {
  const box = document.getElementById("types");
  box.innerHTML = ORDER.filter(t => TC[t]).map(t => `<span class="chip ${on.has(t) ? "on" : ""}" role="switch" tabindex="0" aria-checked="${on.has(t)}" data-t="${t}" style="--c:${COLORS[t]}"><span class="dot"></span>${t}<span class="n">${TC[t]}</span></span>`).join("");
}
document.getElementById("types").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) toggle(c.dataset.t); });
document.getElementById("types").addEventListener("keydown", e => { const c = e.target.closest(".chip"); if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(c.dataset.t); } });
function toggle(t) { on.has(t) ? on.delete(t) : on.add(t); renderChips(); apply(true); }

function visibleSet() {
  if (!focusRoot) return null;
  let s = cy.getElementById(focusRoot);
  for (let i = 0; i < depth; i++) s = s.closedNeighborhood();
  return s;
}
function apply(relayout) {
  const fs = visibleSet();
  cy.batch(() => {
    cy.nodes().forEach(n => {
      const show = on.has(n.data("type")) && (!fs || fs.contains(n)) || (fs && n.id() === focusRoot);
      n.toggleClass("hidden", !show);
    });
    cy.edges().forEach(e => e.toggleClass("hidden", e.source().hasClass("hidden") || e.target().hasClass("hidden")));
  });
  if (relayout) layout();
  highlight();
}
function layout() {
  const vis = cy.elements().not(".hidden");
  vis.layout({ name: "cose", animate: false, randomize: true, padding: 40, nodeRepulsion: () => 9000, idealEdgeLength: () => 70, edgeElasticity: () => 80, gravity: 0.9, numIter: 1200 }).run();
  cy.fit(vis, 40);
}
function highlight() {
  cy.elements().removeClass("faded hl");
  if (!selected) return;
  const n = cy.getElementById(selected);
  if (n.hasClass("hidden")) return;
  const hood = n.closedNeighborhood().not(".hidden");
  cy.elements().not(".hidden").not(hood).addClass("faded");
  hood.addClass("hl");
}

function select(id, opts = {}) {
  const node = byId.get(id); if (!node) return;
  if (!on.has(node.type)) { on.add(node.type); renderChips(); apply(true); }
  selected = id;
  cy.$(":selected").unselect(); cy.getElementById(id).select();
  highlight();
  if (opts.center) cy.animate({ center: { eles: cy.getElementById(id) }, zoom: Math.max(cy.zoom(), 1.1) }, { duration: 250 });
  document.getElementById("focus").disabled = false;
  document.getElementById("depth").disabled = false;
  panel(node);
}
function linkHtml(id) {
  const n = byId.get(id); if (!n) return esc(id);
  return `<a class="node-link" data-id="${esc(id)}" style="--c:${COLORS[n.type]}"><span class="dot"></span><span>${esc(label(n))}</span></a>`;
}
function panel(n) {
  const a = n.attrs;
  const confCls = n.conf === "high" ? "high" : "warn";
  const extra = [];
  if (n.type === "Claim") extra.push(`<span class="pill ${a.status === "approved" ? "high" : a.status === "prohibited" ? "bad" : "warn"}">${esc(a.status || "")}</span>`);
  if (n.type === "Study") extra.push(`<span class="pill ${a.verified ? "high" : "warn"}">${a.verified ? "verified" : "unverified"}</span>`);
  if (n.type === "Product") extra.push(`<span class="pill ${a.status === "active" ? "high" : "warn"}">${esc((a.status || "").replace("_", " "))}</span>`);
  const rows = Object.entries(a).filter(([k, v]) => v !== null && v !== "" && !(Array.isArray(v) && !v.length));
  const out = DATA.edges.filter(e => e.s === n.id), inn = DATA.edges.filter(e => e.t === n.id);
  const edgeRow = (e, dir) => `<li><span class="rel">${dir === "out" ? esc(e.rel) + " →" : "← " + esc(e.rel)}${e.attrs && e.attrs.amount_mg ? " · " + e.attrs.amount_mg + " mg" : ""}</span>${linkHtml(dir === "out" ? e.t : e.s)}</li>`;
  document.getElementById("panel").innerHTML = `
    <div>
      <span class="d-type" style="--c:${COLORS[n.type]}"><span class="dot"></span>${esc(n.type)}</span>
      <h2>${esc(n.type === "FAQItem" ? (a.question || n.name) : n.name)}</h2>
      ${n.aliases && n.aliases.length ? `<div class="aliases">Also: ${esc(n.aliases.join(", "))}</div>` : ""}
    </div>
    <div class="prov"><span class="pill ${confCls}">${esc(n.conf)} confidence</span>${extra.join("")}${n.valid_to ? '<span class="pill bad">superseded</span>' : ""}</div>
    <div class="prov">Source: ${esc(n.source)}</div>
    ${rows.length ? `<div><p class="section-label">Attributes</p><dl>${rows.map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(fmt(v))}</dd>`).join("")}</dl></div>` : ""}
    ${out.length ? `<div><p class="section-label">Points to (${out.length})</p><ul class="links">${out.map(e => edgeRow(e, "out")).join("")}</ul></div>` : ""}
    ${inn.length ? `<div><p class="section-label">Pointed to by (${inn.length})</p><ul class="links">${inn.map(e => edgeRow(e, "in")).join("")}</ul></div>` : ""}
    <p class="note">Internal fields such as cost are left out of this map. It is rebuilt whenever the graph changes.</p>`;
}
function emptyPanel() {
  document.getElementById("panel").innerHTML = `
    <div class="empty">
      <p class="section-label">How to read it</p>
      <p>Each dot is one thing the business knows about: a product, a peptide, a lot, a study, a claim. Lines are relationships, pointing from one to the other.</p>
      <p>Click a dot to see its details and connections. Use the chips to add or hide kinds of things, and search to jump straight to one.</p>
      <p>A dashed outline means the fact is not yet high-confidence. A red dashed outline marks a prohibited claim, kept so copy checkers can recognise it.</p>
    </div>
    <p class="note">Internal fields such as cost are left out of this map. It is rebuilt whenever the graph changes.</p>`;
}

document.getElementById("panel").addEventListener("click", e => { const a = e.target.closest("a.node-link"); if (a) select(a.dataset.id, { center: true }); });
cy.on("tap", "node", e => select(e.target.id()));
cy.on("dbltap", "node", e => { select(e.target.id()); focusRoot = e.target.id(); apply(true); });
cy.on("tap", e => { if (e.target === cy) { selected = null; cy.$(":selected").unselect(); highlight(); emptyPanel(); } });
document.getElementById("focus").onclick = () => { if (selected) { focusRoot = selected; apply(true); } };
document.getElementById("depth").onclick = () => { depth = depth === 1 ? 2 : 1; document.getElementById("depth").textContent = "Depth " + depth; if (focusRoot) apply(true); };
document.getElementById("all").onclick = () => { focusRoot = null; apply(true); };
document.getElementById("fit").onclick = () => cy.fit(cy.elements().not(".hidden"), 40);

const dl = document.getElementById("names");
dl.innerHTML = DATA.nodes.map(n => `<option value="${esc(label(n))}">${esc(n.type)}</option>`).join("");
document.getElementById("q").addEventListener("change", e => {
  const q = e.target.value.trim().toLowerCase(); if (!q) return;
  const hit = DATA.nodes.find(n => label(n).toLowerCase() === q) || DATA.nodes.find(n => label(n).toLowerCase().includes(q) || (n.aliases || []).some(a => a.toLowerCase().includes(q)));
  if (hit) select(hit.id, { center: true });
});

renderChips(); apply(true); emptyPanel();
</script>
</body>
</html>
