[project]
name = "energy-peptides-kg"
version = "0.1.0"
description = "Knowledge graph + task graphs: AI infrastructure for Energy Peptides"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "anthropic>=1.2.0",
    "pydantic>=2.0",
]

[project.scripts]
kg = "kg.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kg"]
