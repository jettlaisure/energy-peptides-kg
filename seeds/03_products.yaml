# Full catalog: 20 products from inbox/product-list-full.pdf + bacteriostatic water from the 2026-09-09 sheet = 21 SKUs.
# SKU pattern EP-<CODE>-<total mg>. Codes: RT retatrutide, TZ tirzepatide, BPC, B1/B2 blends (component-named; nicknames are aliases only),
# KPV, CU GHK-Cu, IPA ipamorelin, TESA tesamorelin, MOTS, SS SS-31, MT1/MT2 melanotan, NAD, BAC.
# Everything is sold by the single 3 mL vial (Jett, 2026-09-10) — no kits.
# KLOW is the printed label name of EP-B2-80 (display_name); it is always shown with components and amounts.
# Drafts (Retatrutide 15mg, GLOW 70mg) have labels but no pricing yet: status draft keeps them off the site.
# status: active = stocked per the 2026-09-09 count; coming_soon = listed, not purchasable until a lot + count enter the ledger.
# 80 mg blend split per Jett (2026-09-10): GHK-Cu 50 mg, BPC-157 10 mg, TB-500 10 mg, KPV 10 mg.
# cost_usd is internal: never enters copy contexts or the site.
# cost_usd (2026-10-09, Jett: 'work off the Monārch sheet from now on'): per-vial cost from Monārch Fill & Finishing at the 1-kit
# (10-vial) tier = kit price / 10 (inbox/monarch-wholesale-price-sheet-2026-09.pdf). Tier assumption: stock counts are 5-10 vials
# per SKU. All four tiers, and the old FSD cost per vial, live on SOURCED_FROM edges. SKUs Monārch does not list keep the FSD
# cost: Retatrutide 15mg (none), Tirzepatide 15mg, GHK-Cu 50mg, MOTS-c 10mg (Monārch: 20/40mg), SS-31 30mg (Monārch: 50mg), bac water.
# Fulfilment plan (Jett, 2026-10-09): just-in-time supply from Monārch, one kit of 10 per SKU minimum, collected in person.
#   fulfilment: stocked      = a kit is bought and one vial sent for a certificate up front: Retatrutide 10mg, Retatrutide 20mg, Tirzepatide 10mg, BPC-157 10mg.
#   fulfilment: just_in_time = listed as available at zero on hand; the kit is bought when the first order lands. Cap: kit cost minus
#   one retail sale <= $120: GHK-Cu 100mg, Melanotan I, Melanotan II, KPV, Tirzepatide 20mg, Tirzepatide 30mg, NAD+ 500mg.
#   Everything else over the cap (Retatrutide 30mg, KLOW, Tesamorelin 20mg, Ipamorelin, BPC-157 / TB-500 20mg) or not on the Monārch
#   sheet stays coming_soon or sells its remaining FSD stock and is not reordered.
# purity_spec is the specification (Jett, 2026-09-10); the site shows only the per-lot COA figure.
# Labels v2 (Jett, 2026-09-11): layout change on all 22; NAD+ label reads 'NAD+ (BUFFERED)' on a 5 mL vial.
# vial_glass: NAD+ 500mg ships in amber glass (Jett, 2026-09-11); all other vials clear.
